[workspace]
members = ["crates/spoons-api-client", "crates/spoons-mcp"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/spoons-mcp"

[workspace.dependencies]
anyhow = "1.0.100"
flate2 = "1"
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.13.1", default-features = false, features = [
  "json",
  "gzip",
  "rustls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
