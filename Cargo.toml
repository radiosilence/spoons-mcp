[workspace]
members = ["crates/spoons-api-client", "crates/spoons-mcp"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/radiosilence/spoons-mcp"

[workspace.dependencies]
anyhow = "1.0.104"
flate2 = "1"
futures-util = "0.3"
regex = "1"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "gzip",
  "rustls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
schemars = "1"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
