name: CI/CD

# CD runs after `Checks` has passed on main: a push that changes the version
# publishes the GitHub release, with the binaries from `build` attached.
#
# Every job ends in `Checks`, the one status a ruleset should require. Each
# job runs only for the domains the change touches (see `changes`); a skipped
# job passes `Checks`, a failed or cancelled one fails it. Jobs can therefore
# be added, renamed or skipped without touching branch protection.
on:
  push:
    branches: [main]
  pull_request:
  # Runs every job, and releases whatever version is not yet released: how a
  # failed release is retried.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A pull request's newer push cancels its older run; on main, a newer push
# cancels an older one that releases nothing. A run that may release is in a
# group of its own and is never cancelled, and nor is a manual run. The group
# is chosen before any job runs, so it cannot ask `changes`: a push may release
# when its head commit is titled `release: ` (as `just release` names its pull
# request) or changes the root Cargo.toml, where the version lives.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      build: ${{ steps.filter.outputs.build }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        # The domains a change touches, from its diff. A pull request's is
        # against its base. A push's is against the last commit on main whose
        # run passed, so a push whose run was cancelled or failed is still
        # checked by the next one. A manual run, a push with no passing run in
        # its last two hundred commits, a release, or a diff that cannot be
        # worked out, runs everything.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?" rather than "was everything recognisably irrelevant?". A
        # new top-level directory of code is invisible here until it is added
        # below. Markdown is documentation wherever it sits.
        #
        # Steps run under `bash -eo pipefail`, where grep finding nothing is a
        # failing command rather than an answer, so every question is asked in
        # a condition, and no grep exits early (`-q`) on a pipe whose writer
        # would then fail.
        run: |
          rust=true build=true release=false
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            if passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
                  --status success --limit 1 --json headSha --jq '.[0].headSha // empty') \
              && [ -n "$passed" ] && git fetch -q --deepen=200 origin main \
              && git merge-base --is-ancestor "$passed" HEAD; then
              base=$passed
              # A commit that already passed in another run diffs against its
              # parent: against itself the diff would be empty.
              if [ "$passed" = "$(git rev-parse HEAD)" ]; then
                base=HEAD^1
              fi
            else
              echo "no passing run to diff against -- running everything"
            fi
          fi
          # Whether this run releases, the one answer every release job reads.
          # A pull request: a release PR (branch `release-v*`, or a version
          # change), which runs everything. A push: it changes the version
          # against its parent (not the diff's base, or a push landing while a
          # release run is still going would release it again) and that
          # version is not out yet. A manual run: whatever version is not out
          # yet. Only main releases. Only a 404 means the version is not out:
          # any other error fails this job, since guessing either way releases
          # twice or never.
          version=$(version_of < Cargo.toml)
          bumped=false
          if [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-v*) bumped=true ;; esac
              release=$bumped
              ;;
            *)
              if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                if ! answer=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
                  if [[ "$answer" != *"HTTP 404"* ]]; then
                    echo "::error::could not tell whether v$version is released: $answer"
                    exit 1
                  fi
                  release=true
                fi
              fi
              ;;
          esac
          touches() { printf '%s\n' "$files" | grep -E "$1" | grep -vE '\.md$' > /dev/null; }
          if [ "$EVENT" != "workflow_dispatch" ] && [ "$release" = false ] && [ -n "$base" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'
            # Anything cargo compiles or that decides how. The justfile and
            # mise.toml reach no job: each installs its toolchain itself and
            # runs cargo directly.
            touches '^crates/|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.?(rustfmt|clippy)\.toml$|^\.github/' || rust=false
            # The release binaries. The Rust jobs already check the code, so
            # these build outside a release only when the lockfile or the
            # recipe changed, since the musl build compiles C dependencies
            # (aws-lc-sys) the tests' glibc build does not.
            touches '^Cargo\.lock$|^\.github/' || build=false
          fi
          {
            echo "rust=$rust"
            echo "build=$build"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
          cache-on-failure: true
      # Offline: the API's firewall and token make the live service unfit for
      # CI, so tests run against inline samples.
      - run: cargo test --workspace --locked

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: lint
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo fmt --all -- --check

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md must write
  # exactly what the fragments make. Every change carries a fragment, so this
  # runs for all of them.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # The `spoons` binary in release, for Linux (static, musl) on both
  # architectures and for Apple silicon, each on its own architecture so
  # nothing cross-compiles. Tarred, because an artifact does not keep the
  # executable bit; the tarball is the release's download as it stands.
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cmake/clang for aws-lc-sys, the rustls crypto backend.
      - name: Install build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools musl-dev cmake clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: ${{ matrix.target }}
          cache-on-failure: true
      - run: |
          cargo build --release --locked -p spoons-mcp --target ${{ matrix.target }}
          tar -czf spoons-${{ matrix.name }}.tar.gz -C target/${{ matrix.target }}/release spoons
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spoons-${{ matrix.name }}
          path: spoons-${{ matrix.name }}.tar.gz
          # Long enough to re-run a failed release weeks later.
          retention-days: ${{ needs.changes.outputs.release == 'true' && 90 || 7 }}

  # The one status a ruleset should require. Skipped jobs are domains the
  # change does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, test, lint, format, changelog, build]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────

  # Main only, after `Checks`. Creates the tag through the API, on the commit
  # that was built; the notes are the version's section of CHANGELOG.md, and
  # the downloads are the tarballs from `build`.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, checks, build]
    # Every need having run, not merely not failed: a release without its
    # binaries is not a release.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' && needs.checks.result == 'success' && needs.build.result == 'success' }}
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: spoons-*
      # Release writes go through RELEASE_TOKEN: a release made with the
      # workflow token starts no workflows of its own.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          body_path: notes.md
          files: artifacts/**/*.tar.gz
